<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f7de1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="БЖУ"><link rel="apple-touch-icon" href="icon-180.png">
<title>БЖУ — дневник питания</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#6b7280;--bd:#e3e6ec;--ac:#2f7de1;--p:#2f7de1;--f:#e8a32b;--c:#35a66b;--dg:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232b;--tx:#eceff4;--mu:#98a1b0;--bd:#2c333d;--ac:#5b9cf0;--p:#5b9cf0;--f:#f0b94d;--c:#4cc48a;--dg:#ef6b6b}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232b;--tx:#eceff4;--mu:#98a1b0;--bd:#2c333d;--ac:#5b9cf0;--p:#5b9cf0;--f:#f0b94d;--c:#4cc48a;--dg:#ef6b6b}
html{background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;max-width:520px;padding:12px 12px 40px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.sn{padding:10px 14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:20px}
.nav b{font-size:17px;text-align:center}
.big{display:flex;align-items:baseline;justify-content:space-between}.big span{font-size:34px;font-weight:700}.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;justify-content:space-between;font-size:14px}
.mh{display:flex;align-items:center;justify-content:space-between}.mh b{font-size:17px}
.add{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#fff;font-size:24px;line-height:1}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}.mh+.it{margin-top:6px}
.it div{flex:1;min-width:0}.it .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:36px;height:36px;color:var(--mu);font-size:18px}
.bn{background:var(--card);border:1px solid var(--f);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.bn button{color:var(--ac);font-weight:600;white-space:nowrap}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}#ov[hidden]{display:none}
.sh{background:var(--card);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:8px}
.pk{display:block;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--bd)}
.pb{width:100%;padding:14px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;margin-top:8px;display:block;text-align:center}.pb.g{background:var(--bd);color:var(--tx)}
.ln{color:var(--ac);padding:10px 8px;font-weight:600}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw div{text-align:center;font-size:12px;color:var(--mu);padding:4px 0}.cg{touch-action:pan-y}
.cd{aspect-ratio:1/1.1;border-radius:10px;border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:var(--bg);padding:0}.cd small{font-size:10px;color:var(--mu);min-height:12px}.cd.e{visibility:hidden}.cd.t{border-color:var(--ac);border-width:2px}.cd.o small{color:var(--dg)}.cd.s{background:var(--ac);color:#fff}.cd.s small{color:#fff}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}label{font-size:13px;color:var(--mu)}
</style></head><body>
<div class="nav"><button onclick="go(-1)" aria-label="Назад">‹</button><b id="dt" onclick="cal()" style="cursor:pointer;flex:1">&nbsp;</b><button onclick="go(1)" aria-label="Вперёд">›</button></div>
<div id="app"></div>
<div style="text-align:center"><button class="ln" onclick="goals()">⚙ Норма</button><button class="ln" onclick="mng()">📋 Продукты</button><button class="ln" onclick="fp()">💾 Файл</button></div>
<div id="ov" hidden><div class="sh">
 <div class="hd"><b id="st"></b><button class="x" onclick="cl()">✕</button></div>
 <div id="v1"><input id="q" placeholder="Найти продукт…" oninput="lst()"><div id="ls"></div><button class="ln" onclick="nw()">+ Новый продукт</button></div>
 <div id="v2" hidden><div id="pn" style="font-weight:600;margin-bottom:8px"></div><input id="gr" type="number" inputmode="decimal" placeholder="Масса, г" oninput="pv()"><div id="pvw" class="mu"></div><button class="pb" onclick="ad()">Добавить</button></div>
 <div id="v3" hidden><input id="nn" placeholder="Название"><div class="mu" style="margin-bottom:6px">На 100 г:</div><div class="g3"><div><label>Б</label><input id="np" type="number" inputmode="decimal"></div><div><label>Ж</label><input id="nf" type="number" inputmode="decimal"></div><div><label>У</label><input id="nc" type="number" inputmode="decimal"></div></div><button class="pb" onclick="mk()">Сохранить</button><button id="dl" class="ln" style="color:var(--dg);width:100%" onclick="rm()">Удалить продукт</button></div>
 <div id="v4" hidden><div class="g3"><div><label>Б, г</label><input id="gp" type="number" inputmode="decimal"></div><div><label>Ж, г</label><input id="gf" type="number" inputmode="decimal"></div><div><label>У, г</label><input id="gc" type="number" inputmode="decimal"></div></div><button class="pb" onclick="sg()">Сохранить</button></div>
 <div id="v6" hidden><div class="hd" style="justify-content:center"><button class="x" onclick="mv(-1)" aria-label="Предыдущий месяц">‹</button><b id="ct" style="flex:1;text-align:center"></b><button class="x" onclick="mv(1)" aria-label="Следующий месяц">›</button></div><div class="cw"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div><div id="cg" class="cg"></div><div id="cs" class="mu" style="text-align:center;margin-top:10px"></div><button class="ln" style="width:100%" onclick="pd(today)">Сегодня</button></div>
 <div id="v5" hidden><div id="fi" class="mu" style="margin-bottom:4px"></div>
  <div id="fa" hidden><button class="pb" onclick="pf()">Создать файл данных (автосохранение)</button><button class="pb g" onclick="of()">Открыть существующий файл данных</button></div>
  <button class="pb g" onclick="sh()">Сохранить копию в файл…</button>
  <label class="pb g">Загрузить данные из файла<input type="file" accept=".json,.txt,application/json,text/plain" hidden onchange="im(this)"></label></div>
</div></div>
<script>
const BASE=[["Куриная грудка (сырая)",23.6,1.9,.4],["Говядина (сырая)",18.9,12.4,0],["Лосось",20,13,0],["Минтай",16,.9,0],["Яйцо куриное",12.7,11.5,.7],["Творог 5%",17,5,1.8],["Молоко 2,5%",2.8,2.5,4.7],["Кефир 1%",3,1,4],["Йогурт натуральный",5,3.2,3.5],["Сметана 15%",2.6,15,3],["Сыр твёрдый",23,30,0],["Гречка (сухая)",12.6,3.3,62.1],["Рис (сухой)",7,1,74],["Овсяные хлопья",12.3,6.1,59.5],["Макароны (сухие)",11,1.3,70],["Хлеб пшеничный",8.1,1,48.8],["Картофель",2,.4,16.3],["Морковь",1.3,.1,6.9],["Огурец",.8,.1,2.5],["Помидор",.9,.2,3.8],["Яблоко",.4,.4,9.8],["Банан",1.5,.2,21.8],["Масло оливковое",0,99.8,0],["Масло сливочное 82,5%",.5,82.5,.8],["Миндаль",18.6,57.7,13.6],["Сахар",0,0,99.7]];
const MEALS=["Завтрак","Перекус","Обед","Перекус","Ужин","Перекус"],SN=[0,1,0,1,0,1];
let S={g:{p:120,f:70,c:250},db:BASE.map(x=>x.slice()),d:{},dirty:0,saved:0};
function adopt(o){if(!o||!o.d||!o.g)return false;if(!o.db)o.db=[...(o.cu||[]),...BASE.map(x=>x.slice())];S=Object.assign({g:{p:120,f:70,c:250},db:[],d:{},saved:0},o);S.dirty=0;return true}
try{const r=localStorage.getItem("bju2");if(r)adopt(JSON.parse(r))}catch(e){}
const store=()=>{try{localStorage.setItem("bju2",JSON.stringify(S))}catch(e){}};
let H=null,perm=true,tm,mode="add",ed=-1,IX=[],am=0,sel=null;
function save(){S.dirty=(S.dirty||0)+1;store();if(H){clearTimeout(tm);tm=setTimeout(wr,400)}}
async function wr(){try{if((await H.queryPermission({mode:"readwrite"}))!=="granted"){perm=false;render();return}const w=await H.createWritable();S.saved=Date.now();await w.write(JSON.stringify(S));await w.close();perm=true;S.dirty=0;store();render()}catch(e){perm=false;render()}}
async function resume(){try{if((await H.requestPermission({mode:"readwrite"}))==="granted"){perm=true;await wr()}}catch(e){}}
const idb=(m,v)=>new Promise((ok,no)=>{const q=indexedDB.open("bju",1);q.onupgradeneeded=()=>q.result.createObjectStore("h");q.onsuccess=()=>{const s=q.result.transaction("h",m==="get"?"readonly":"readwrite").objectStore("h"),r=m==="get"?s.get("f"):s.put(v,"f");r.onsuccess=()=>ok(r.result);r.onerror=()=>no()};q.onerror=()=>no()});
const FT={types:[{description:"Данные БЖУ",accept:{"application/json":[".json"]}}]};
async function initH(){try{const h=await idb("get");if(!h)return;H=h;perm=(await h.queryPermission({mode:"readwrite"}))==="granted";if(perm){const o=JSON.parse(await(await h.getFile()).text());if(!S.dirty&&(o.saved||0)>(S.saved||0)){adopt(o);store()}else if(S.dirty)wr()}render()}catch(e){}}
async function pf(){try{H=await showSaveFilePicker({suggestedName:"bju-data.json",...FT});await idb("put",H);await wr();cl()}catch(e){}}
async function of(){try{const[h]=await showOpenFilePicker(FT);if(adopt(JSON.parse(await(await h.getFile()).text()))){H=h;await idb("put",h);store();cl();render()}}catch(e){}}
async function sh(){const f=new File([JSON.stringify(S)],"bju-data.json",{type:"text/plain"});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download="bju-data.json";a.click()}S.dirty=0;S.saved=Date.now();store();render();fp()}catch(e){}}
function im(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{if(!adopt(JSON.parse(t)))throw 0;store();if(H)wr();cl();render()}catch(e){alert("Не удалось прочитать файл")}})}
function fp(){const t=S.saved?new Date(S.saved).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"ещё не сохранялось";$("fi").textContent=(H?"Автосохранение в файл: включено. ":"")+"Последнее сохранение: "+t+(S.dirty?"; изменений после него: "+S.dirty:"");$("fa").hidden=!window.showSaveFilePicker;sv(5,"Файл с данными");$("ov").hidden=false}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=iso(new Date());let cur=today;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r1=x=>Math.round(x*10)/10,kc=(p,f,c)=>Math.round(p*4+f*9+c*4);
function go(n){const d=new Date(cur+"T12:00:00");d.setDate(d.getDate()+n);cur=iso(d);render()}
function bar(l,v,g,col){return `<div class="row"><span>${l}</span><span class="mu">${r1(v)} / ${g} г</span></div><div class="bar"><i style="width:${Math.min(100,g?v/g*100:0)}%;background:${v>g?'var(--dg)':col}"></i></div>`}
function render(){
 const E=S.d[cur]||[],t=E.reduce((a,e)=>({p:a.p+e.p,f:a.f+e.f,c:a.c+e.c}),{p:0,f:0,c:0}),G=S.g,gk=kc(G.p,G.f,G.c),k=kc(t.p,t.f,t.c),left=gk-k;
 $("dt").textContent=(cur===today?"Сегодня, ":"")+new Date(cur+"T12:00:00").toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})+" ▾";
 let h="";
 if(H&&!perm)h+=`<div class="bn"><span>Автосохранение в файл на паузе</span><button onclick="resume()">Продолжить</button></div>`;
 else if(!H&&S.dirty>0)h+=`<div class="bn"><span>Не сохранено в файл: ${S.dirty} изм.</span><button onclick="sh()">Сохранить</button></div>`;
 h+=`<div class="card"><div class="big"><span>${k}</span><span class="mu">из ${gk} ккал</span></div><div class="bar"><i style="width:${Math.min(100,gk?k/gk*100:0)}%;background:${left<0?'var(--dg)':'var(--ac)'}"></i></div><div class="mu" style="margin-bottom:12px">${left>=0?"Осталось "+left:"Перебор "+(-left)} ккал</div>${bar("Белки",t.p,G.p,"var(--p)")}${bar("Жиры",t.f,G.f,"var(--f)")}${bar("Углеводы",t.c,G.c,"var(--c)")}</div>`;
 MEALS.forEach((m,mi)=>{const it=E.map((e,i)=>[e,i]).filter(x=>x[0].m===mi),sk=it.reduce((a,x)=>a+kc(x[0].p,x[0].f,x[0].c),0);
  h+=`<div class="card${SN[mi]?' sn':''}"><div class="mh"><div><b>${m}</b> <span class="mu">${sk?sk+" ккал":""}</span></div><button class="add" onclick="op(${mi})" aria-label="Добавить">+</button></div>`+
  it.map(([e,i])=>`<div class="it"><div><div class="n">${esc(e.n)}</div><div class="mu">${e.g} г · Б ${r1(e.p)} · Ж ${r1(e.f)} · У ${r1(e.c)}</div></div><b>${kc(e.p,e.f,e.c)}</b><button class="x" onclick="del(${i})" aria-label="Удалить">✕</button></div>`).join("")+`</div>`});
 $("app").innerHTML=h}
function del(i){S.d[cur].splice(i,1);save();render()}
function sv(n,t){for(let i=1;i<=6;i++)$("v"+i).hidden=i!==n;$("st").textContent=t||""}
function op(m){am=m;mode="add";$("q").value="";lst();sv(1,"Добавить: "+MEALS[m]);$("ov").hidden=false}
function mng(){mode="mng";$("q").value="";lst();sv(1,"Все продукты ("+S.db.length+")");$("ov").hidden=false}
function cl(){$("ov").hidden=true}
function lst(){const q=$("q").value.trim().toLowerCase();IX=[];S.db.forEach((p,i)=>{if(p[0].toLowerCase().includes(q))IX.push(i)});IX=IX.slice(0,80);
 $("ls").innerHTML=IX.length?IX.map((i,k)=>{const p=S.db[i];return `<button class="pk" onclick="pc(${k})">${esc(p[0])}<div class="mu">Б ${p[1]} · Ж ${p[2]} · У ${p[3]}</div></button>`}).join(""):'<div class="mu" style="padding:8px 0">Ничего не найдено.</div>'}
function pc(k){const i=IX[k];if(mode==="mng")return edit(i);sel=S.db[i];$("pn").textContent=sel[0];$("gr").value="";$("pvw").textContent="";sv(2,MEALS[am]);setTimeout(()=>$("gr").focus(),50)}
function pv(){const g=+$("gr").value;$("pvw").textContent=g>0?`Б ${r1(sel[1]*g/100)} · Ж ${r1(sel[2]*g/100)} · У ${r1(sel[3]*g/100)} · ${kc(sel[1]*g/100,sel[2]*g/100,sel[3]*g/100)} ккал`:""}
function ad(){const g=+$("gr").value;if(!(g>0))return;(S.d[cur]=S.d[cur]||[]).push({m:am,n:sel[0],g,p:sel[1]*g/100,f:sel[2]*g/100,c:sel[3]*g/100});save();cl();render()}
function nw(){ed=-1;["nn","np","nf","nc"].forEach(i=>$(i).value="");$("dl").hidden=true;sv(3,"Новый продукт")}
function edit(i){ed=i;const p=S.db[i];$("nn").value=p[0];$("np").value=p[1];$("nf").value=p[2];$("nc").value=p[3];$("dl").hidden=false;sv(3,"Изменить продукт")}
function mk(){const n=$("nn").value.trim();if(!n)return;const a=[n,+$("np").value||0,+$("nf").value||0,+$("nc").value||0];
 if(ed>=0)S.db[ed]=a;else S.db.unshift(a);save();
 if(mode==="add"&&ed<0){sel=a;$("pn").textContent=n;$("gr").value="";$("pvw").textContent="";sv(2,MEALS[am]);setTimeout(()=>$("gr").focus(),50)}else{$("q").value="";lst();sv(1,"Все продукты ("+S.db.length+")")}}
function rm(){if(ed<0||!confirm("Удалить «"+S.db[ed][0]+"» из списка? Записи в дневнике останутся."))return;S.db.splice(ed,1);save();$("q").value="";lst();sv(1,"Все продукты ("+S.db.length+")")}
function goals(){$("gp").value=S.g.p;$("gf").value=S.g.f;$("gc").value=S.g.c;sv(4,"Норма на день");$("ov").hidden=false}
function sg(){S.g={p:+$("gp").value||0,f:+$("gf").value||0,c:+$("gc").value||0};save();cl();render()}
let cm=[0,0],tx=null;const cap=s=>s[0].toUpperCase()+s.slice(1);
function cal(){const d=new Date(cur+"T12:00:00");cm=[d.getFullYear(),d.getMonth()];drawCal();sv(6,"");$("ov").hidden=false}
function mv(n){cm[1]+=n;if(cm[1]<0){cm[1]=11;cm[0]--}if(cm[1]>11){cm[1]=0;cm[0]++}drawCal()}
function drawCal(){const[y,m]=cm,n=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7,gk=kc(S.g.p,S.g.f,S.g.c);let h="",tot=0,days=0;
 for(let i=0;i<off;i++)h+='<div class="cd e"></div>';
 for(let d=1;d<=n;d++){const k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),E=S.d[k]||[],s=E.reduce((a,e)=>a+kc(e.p,e.f,e.c),0);if(E.length){tot+=s;days++}
  h+=`<button class="cd${k===today?' t':''}${k===cur?' s':''}${s>gk?' o':''}" onclick="pd('${k}')">${d}<small>${E.length?s:"&nbsp;"}</small></button>`}
 $("ct").textContent=cap(new Date(y,m,1).toLocaleDateString("ru-RU",{month:"long",year:"numeric"}));$("cg").innerHTML=h;
 $("cs").textContent=days?`Дней с записями: ${days} · в среднем ${Math.round(tot/days)} ккал`:"В этом месяце записей нет"}
function pd(k){cur=k;cl();render()}
$("v6").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("v6").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)mv(dx<0?1:-1)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
render();initH();
</script></body></html>
